<meta name="claude:viewport-fit-sides" content="cover">
<title>The Field</title>
<style>
/* ============================================================
   THE FIELD - a leadership journey
   Layout: full-bleed layered-SVG stage with an overlaid UI panel.
   Palette: warm paper ground, dusk-blue ink, marigold + jade
   accents, plum as the Chak Sohni tint.
   ============================================================ */
:root{
  /* ---- light (paper) ---- */
  --paper:#f4ecd8;        /* warm paper background */
  --paper-2:#ece0c6;      /* slightly deeper paper */
  --ink:#283557;          /* dusk-blue ink (text) */
  --ink-soft:#4a567a;     /* muted ink */
  --ink-faint:#7d85a3;    /* faint ink */
  --gold:#e0a63c;         /* marigold */
  --gold-deep:#b9801f;    /* darker marigold for text/hover (AA) */
  --jade:#2f9e78;         /* jade */
  --jade-deep:#1f7256;    /* darker jade (AA on paper) */
  --plum:#7c3f6d;         /* plum - Chak Sohni tint */
  --plum-soft:#9c5c8c;
  --card:#fbf6e9;         /* panel surface */
  --card-line:#d9c9a3;    /* hairlines on paper */
  --shadow:rgba(40,40,60,.18);
  --good:#2f9e78;
  --warn:#d98a2b;
  --bad:#c6513f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171a24;
  --paper-2:#11131b;
  --ink:#ede6d4;
  --ink-soft:#c3bca8;
  --ink-faint:#8d8aa0;
  --gold:#e8b457;
  --gold-deep:#f0c268;
  --jade:#48c396;
  --jade-deep:#5fd3a8;
  --plum:#c07faf;
  --plum-soft:#a86897;
  --card:#1f2330;
  --card-line:#333a4d;
  --shadow:rgba(0,0,0,.5);
  --good:#48c396;--warn:#e8a94e;--bad:#e2705c;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#171a24;--paper-2:#11131b;--ink:#ede6d4;--ink-soft:#c3bca8;
  --ink-faint:#8d8aa0;--gold:#e8b457;--gold-deep:#f0c268;--jade:#48c396;
  --jade-deep:#5fd3a8;--plum:#c07faf;--plum-soft:#a86897;--card:#1f2330;
  --card-line:#333a4d;--shadow:rgba(0,0,0,.5);
  --good:#48c396;--warn:#e8a94e;--bad:#e2705c;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
h1,h2,h3,.story,.display{
  font-family:"Fraunces","Iowan Old Style",Georgia,"Times New Roman",serif;
}

/* ---------- stage ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.scene.active{opacity:1;pointer-events:auto}
.scene svg,.scene .bg{position:absolute;inset:0;width:100%;height:100%}
.bgwrap{position:absolute;inset:0;will-change:transform;transition:transform 1.6s cubic-bezier(.4,.1,.2,1)}

/* dim/blur overlays used in Scene 5 -> Part A */
.scrim{position:absolute;inset:0;background:rgba(18,16,28,.0);transition:background 1s ease,backdrop-filter 1s ease;pointer-events:none}
.scrim.on{background:rgba(18,16,28,.46);backdrop-filter:blur(5px)}

/* ---------- fades ---------- */
#fader{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1s ease;z-index:60}
#fader.on{opacity:1}

/* ---------- progress dots ---------- */
.dots{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;
  display:flex;gap:10px;justify-content:center;z-index:30}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);
  border:1.5px solid rgba(255,255,255,.7);transition:all .4s}
.dot.on{background:var(--gold);border-color:var(--gold);transform:scale(1.25)}
:root[data-theme="dark"] .dot,
@media (prefers-color-scheme:dark){.dot{background:rgba(255,255,255,.25)}}

/* ---------- logo ---------- */
.brand{display:inline-flex;align-items:center;gap:9px;font-family:"Fraunces",serif;
  font-weight:600;letter-spacing:.01em}
.brand .mark{width:26px;height:26px;flex:0 0 auto}
.brand small{font-family:"Figtree",sans-serif;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;font-size:.62rem;color:var(--ink-faint)}

/* ---------- story caption panel ---------- */
.cap{position:absolute;left:0;right:0;bottom:0;z-index:25;
  padding:22px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,rgba(10,8,18,.82) 0%,rgba(10,8,18,.6) 55%,rgba(10,8,18,0) 100%);
}
.cap .inner{max-width:620px;margin:0 auto}
.story{color:#faf4e6;font-size:clamp(1.18rem,4.6vw,1.72rem);line-height:1.5;
  text-wrap:balance;min-height:3.2em;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.story .ln{display:block}
.caret{display:inline-block;width:.5ch;color:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{margin-top:10px;font-size:.78rem;color:rgba(250,244,230,.72);letter-spacing:.03em;
  display:flex;align-items:center;gap:7px;min-height:1.2em}
.hint.show{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* ---------- buttons ---------- */
.btn{font-family:"Figtree",sans-serif;font-weight:600;font-size:1rem;
  border:none;border-radius:13px;padding:15px 24px;min-height:52px;cursor:pointer;
  background:var(--gold);color:#2a1d04;box-shadow:0 4px 14px var(--shadow);
  transition:transform .15s,box-shadow .2s,background .2s;letter-spacing:.01em}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 20px var(--shadow)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--card-line)}
.btn.ghost:hover{background:var(--paper-2)}
.btn.jade{background:var(--jade);color:#06251a}
.btn.plum{background:var(--plum);color:#fdeef8}
.btn.big{font-size:1.1rem;padding:17px 30px}
.btn:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--plum-soft);outline-offset:2px}

/* ---------- overlay panels (codename, plan, cards, debrief) ---------- */
.panel{position:absolute;inset:0;z-index:35;display:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel.active{display:block}
.sheet{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-left,0px))
          calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-right,0px));gap:18px}
.box{width:100%;max-width:560px;background:var(--card);border:1px solid var(--card-line);
  border-radius:20px;box-shadow:0 12px 40px var(--shadow);padding:26px 22px}
.box h2{font-size:clamp(1.4rem,5vw,2rem);margin:0 0 6px;text-wrap:balance;line-height:1.15}
.box .lead{color:var(--ink-soft);font-size:1rem;margin:0 0 18px;line-height:1.5}
.eyebrow{font-family:"Figtree",sans-serif;text-transform:uppercase;letter-spacing:.16em;
  font-size:.68rem;font-weight:700;color:var(--plum)}
:root[data-theme="dark"] .eyebrow{color:var(--plum)}

label.fld{display:block;margin-bottom:16px}
label.fld span{display:block;font-weight:600;font-size:.92rem;margin-bottom:7px;color:var(--ink)}
textarea,input[type=text]{width:100%;font-family:"Figtree",sans-serif;font-size:16px;
  color:var(--ink);background:var(--paper);border:1.5px solid var(--card-line);
  border-radius:12px;padding:13px 14px;resize:vertical;line-height:1.45}
textarea{min-height:76px}
textarea:focus,input:focus{border-color:var(--plum-soft)}

/* progress bar (Part A) */
.pbar{display:flex;gap:6px;width:100%;max-width:560px;margin-bottom:4px}
.pseg{flex:1;height:6px;border-radius:3px;background:var(--card-line)}
.pseg.on{background:var(--gold)}

/* sliders */
.slider-row{margin-bottom:16px}
.slider-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.slider-row .top b{font-weight:600;font-size:.95rem}
.slider-row .top .val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold-deep)}
input[type=range]{width:100%;accent-color:var(--plum);height:30px}
.counter{text-align:center;font-weight:700;font-size:1.05rem;margin:10px 0 2px;
  font-variant-numeric:tabular-nums}
.counter.ok{color:var(--jade-deep)}
.counter.over{color:var(--bad)}

/* ---- bucket step (A2) - ported from bucket-step.html, scoped under #bucket-step ---- */
.box.bl{background:#fbf4e6;border-color:#e6d9b8;color:#26305a;
  --ink:#26305a;--ink-soft:#4a5173;--ink-faint:#6b7194;--plum:#8a4a6b;--card-line:#e6d9b8}
#bucket-step{--font-sans:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --font-voice:"Fraunces","Iowan Old Style",Georgia,serif;
  --navy:#26305a;--cream:#fbf4e6;--cream-line:#e6d9b8;--gold:#e0a53a;--gold-text:#b07a14;
  --plum:#8a4a6b;--muted:#5b6283;--body:#4a5173;--burlap:#e8cf96;--burlap-line:#7a5a22;
  --pile:#f1e4c3;--green:#2f8f63;
  position:relative;color:var(--navy);font-family:var(--font-sans)}
#bucket-step .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#bucket-step .sack,#bucket-step .sack:hover,#bucket-step .sack:active,#bucket-step .sack:focus,#bucket-step .sack:focus-visible{all:unset;box-sizing:border-box;position:absolute;width:84px;height:90px;display:flex;align-items:center;justify-content:center;border-radius:14px;cursor:pointer;background:transparent!important;box-shadow:none!important;transform:none!important;border:0!important}
#bucket-step .sack:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#bucket-step .art{width:76px;height:82px;display:block}
#bucket-step .art svg{display:block}
@keyframes wig{0%,100%{transform:translateY(-5px) scale(1.1) rotate(0deg)}25%{transform:translateY(-8px) scale(1.1) rotate(-9deg)}75%{transform:translateY(-8px) scale(1.1) rotate(9deg)}}
@keyframes wigs{0%,100%{transform:rotate(0deg) scale(1.08)}25%{transform:rotate(-9deg) scale(1.08)}75%{transform:rotate(9deg) scale(1.08)}}
#bucket-step .sack:not(.away):hover .art svg,#bucket-step .sack:not(.away):focus-visible .art svg{animation:wig .7s ease-in-out infinite}
#bucket-step .sack.in .art svg,#bucket-step .sack.away .art svg{visibility:hidden}
#bucket-step .bs{cursor:pointer;outline:none}
#bucket-step .bs:hover use,#bucket-step .bs:focus-visible use{transform-box:fill-box;transform-origin:center;animation:wigs .7s ease-in-out infinite}

#bucket-step .pile{position:relative;height:400px;background:var(--pile);border-radius:16px}
#bucket-step .clone{position:absolute;pointer-events:none;z-index:5;width:56px;height:60px}

#bucket-step .bscrim{position:absolute;inset:0;background:rgba(251,244,230,.8);border-radius:16px;display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
#bucket-step .pop{background:#fffaf0;border:1px solid var(--cream-line);border-radius:16px;padding:16px 18px;width:min(300px,100%);text-align:center}
#bucket-step .pt{font-family:var(--font-voice);font-size:22px;font-weight:500;line-height:1.2;color:var(--navy);margin:4px 0}
#bucket-step .pd{font-size:14px;line-height:1.45;color:var(--body);margin:0 0 8px}
#bucket-step .pp{display:inline-block;font-size:15px;font-weight:500;color:#8a5d0c;background:#f6e3b8;border-radius:999px;padding:3px 14px}
#bucket-step .pw{min-height:18px;font-size:13px;margin:8px 0 0;color:var(--muted)}
#bucket-step .prow{display:flex;gap:10px;justify-content:center;margin-top:10px}

#bucket-step .pb,#bucket-step .pb:hover,#bucket-step .pb:active,#bucket-step .pb:focus,#bucket-step .nb,#bucket-step .nb:hover,#bucket-step .nb:active,#bucket-step .nb:focus{all:unset;box-sizing:border-box;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;text-align:center;box-shadow:none!important;transform:none!important}
#bucket-step .nb,#bucket-step .nb:hover,#bucket-step .nb:active,#bucket-step .nb:focus{padding:11px 22px;font-size:15px}
#bucket-step .pri,#bucket-step .pri:hover,#bucket-step .pri:active,#bucket-step .pri:focus{background:var(--gold)!important;color:var(--navy)!important}
#bucket-step .sec,#bucket-step .sec:hover,#bucket-step .sec:active,#bucket-step .sec:focus{background:#fffaf0!important;color:var(--navy)!important;border:1px solid #dccaa0!important}
#bucket-step .pb:focus-visible,#bucket-step .nb:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#bucket-step .pb:hover,#bucket-step .nb:hover{opacity:.9}

@media (max-width:560px){#bstage{grid-template-columns:minmax(0,1fr)!important}}

/* ---- vendor step (A3) - ported from the Step 3 design, scoped under #vendor-step ---- */
.box.bv{max-width:760px;border-radius:22px;padding:28px 24px 24px;background:#FCF5E8;border:1px solid #E3CFA3;
  box-shadow:0 18px 40px rgba(43,30,40,.28);color:#2B3454;
  --ink:#2B3454;--ink-soft:#4F5578;--ink-faint:#5C6280;--plum:#7B3F6E;--card-line:#E3CFA3}
#vendor-step{font-family:"Figtree",ui-sans-serif,system-ui,sans-serif;color:#2B3454}
#vendor-step .vstep{font-size:13px;font-weight:700;color:#7B3F6E}
#vendor-step h2.vtitle{margin:4px 0 8px;font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-weight:700;font-size:36px;line-height:1.1;color:#2B3454}
#vendor-step .vsub{margin:0;font-size:17px;line-height:1.5;color:#4F5578;max-width:62ch}
#vendor-step .vhint{margin:10px 0 14px;font-size:14px;color:#5C6280}

#vendor-step .vpicks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0;padding:0}
#vendor-step .vpick{appearance:none;border:0;margin:0;padding:10px 8px 12px;cursor:pointer;background:transparent;border-radius:22px;font:inherit;color:inherit;
  display:grid;grid-template-columns:1fr;justify-items:center;align-content:start;grid-template-areas:"cloud" "trail" "person" "name";
  transition:background .2s ease,opacity .25s ease;text-align:center}
#vendor-step .vpick:hover{background:rgba(224,160,58,.12)}
#vendor-step .vpick:focus-visible{outline:3px solid #7B3F6E;outline-offset:2px}
#vendor-step .vpick.is-on{background:#F6E7C6}
#vendor-step .vpick.is-dim{opacity:.6}
#vendor-step .vpick.is-dim:hover{opacity:1}

#vendor-step .vcloud{position:relative;width:100%;aspect-ratio:220/200;grid-area:cloud;transition:transform .25s ease;transform-origin:50% 90%;animation:vbob 6s ease-in-out infinite alternate}
#vendor-step .vpick:nth-child(2) .vcloud{animation-delay:-2s}
#vendor-step .vpick:nth-child(3) .vcloud{animation-delay:-4s}
#vendor-step .vpick:hover .vcloud,#vendor-step .vpick:focus-visible .vcloud{transform:scale(1.04)}
#vendor-step .vpick.is-on .vcloud{transform:scale(1.06)}
#vendor-step .vcloud svg.vbg{position:absolute;inset:0;width:100%;height:100%}
#vendor-step .vcl{fill:#E3CFA3;stroke:#E3CFA3;stroke-width:5;transition:fill .2s ease,stroke .2s ease}
#vendor-step .vcf{fill:#FFFDF7;transition:fill .2s ease}
#vendor-step .vpick.is-on .vcl{fill:#C98F1E;stroke:#C98F1E}
#vendor-step .vpick.is-on .vcf{fill:#FBE3A6}

#vendor-step .vthought{position:absolute;left:14%;right:14%;top:27%;bottom:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
#vendor-step .vprice{font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-weight:700;font-size:25px;line-height:1;color:#8A5809;font-variant-numeric:tabular-nums}
#vendor-step .vprice small{font-family:"Figtree",ui-sans-serif,system-ui,sans-serif;font-size:12px;font-weight:700;margin-right:4px;letter-spacing:.02em}
#vendor-step .vline{font-size:13px;line-height:1.3;color:#2B3454}

#vendor-step .vbadge{position:absolute;top:6%;right:8%;width:30px;height:30px;display:none}
#vendor-step .vpick.is-on .vbadge{display:block}

#vendor-step .vtrail{grid-area:trail;width:44px;height:34px;margin-top:-6px}
#vendor-step .vperson{grid-area:person;width:108px;height:auto;margin-top:2px}
#vendor-step .vpick.is-on .vperson{animation:vhop .5s ease-out 1}
#vendor-step .vpicks.vinit .vpick.is-on .vperson{animation:none}
#vendor-step .vwho{grid-area:name;margin-top:6px;font-weight:700;font-size:16px;color:#2B3454}

#vendor-step .vfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:18px}
#vendor-step .vstatus{font-size:14px;color:#5C6280;min-height:20px;flex:1 1 220px}
#vendor-step .vbtns{display:flex;gap:12px}
#vendor-step .vbtn{appearance:none;min-height:48px;padding:0 26px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#vendor-step .vbtn:focus-visible{outline:3px solid #7B3F6E;outline-offset:2px}
#vendor-step .vback{background:#FFFDF7;color:#2B3454;border:1px solid #E3CFA3;box-shadow:0 6px 14px rgba(43,52,84,.14)}
#vendor-step .vnext{background:#E0A03A;color:#2B3454;border:1px solid #E0A03A}
#vendor-step .vnext:disabled{background:#F2DFB2;border-color:#F2DFB2;color:#7A6B4D;cursor:not-allowed}

@keyframes vbob{from{translate:0 0}to{translate:0 -6px}}
@keyframes vhop{0%{transform:translateY(0)}40%{transform:translateY(-14px)}100%{transform:translateY(0)}}

@media (max-width:680px){
  #vendor-step .vpicks{grid-template-columns:1fr;gap:10px}
  #vendor-step .vpick{grid-template-columns:104px minmax(0,1fr);grid-template-areas:"person cloud" "name cloud";align-items:center;justify-items:center;column-gap:6px}
  #vendor-step .vtrail{display:none}
  #vendor-step .vperson{width:96px}
  #vendor-step .vwho{margin-top:0}
  #vendor-step h2.vtitle{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  #vendor-step .vcloud,#vendor-step .vpick.is-on .vperson{animation:none}
  #vendor-step .vcloud,#vendor-step .vpick,#vendor-step .vcl,#vendor-step .vcf{transition:none}
}

/* ---- project kickoff (after Team roles), ported from the Project kickoff design, scoped under #kickoff-step ---- */
.box.bl.bk{max-width:760px;padding:20px;border-radius:22px;background:#FCF5E8;border:1px solid #E3CFA3;box-shadow:0 18px 40px rgba(43,30,40,.28);color:#2B3454}
#kickoff-step{font-family:"Figtree",ui-sans-serif,system-ui,sans-serif}
#kickoff-step .kscene{position:relative;height:340px;overflow:hidden;border-radius:16px;background:linear-gradient(#BEDCE7 0%,#F4EBD0 72%)}
#kickoff-step .klayer{position:absolute;left:0;top:0;width:1520px;height:340px;display:flex;will-change:transform}
#kickoff-step .klayer svg{flex:none;width:760px;height:340px;display:block}
#kickoff-step .kstatic{position:absolute;left:0;top:0;width:100%;height:340px}

#kickoff-step .kdrive{position:absolute;left:16%;top:193px;width:220px;height:120px;transform:translateX(-380px);will-change:transform}
#kickoff-step .kbus{width:220px;height:120px;display:block}
#kickoff-step .kwheel{transform-box:fill-box;transform-origin:center}

#kickoff-step .kmsg{position:absolute;left:0;right:0;top:22px;display:flex;justify-content:center;padding:0 12px;opacity:0;pointer-events:none}
#kickoff-step .kmsg-card{box-sizing:border-box;max-width:100%;background:#FCF5E8;border:1px solid #E3CFA3;border-radius:20px;padding:14px 24px 16px;text-align:center;box-shadow:0 14px 30px rgba(43,52,84,.22)}
#kickoff-step .kmsg-title{margin:0;font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-weight:700;font-size:30px;line-height:1.1;color:#2B3454}
#kickoff-step .kmsg-sub{margin:6px 0 0;font-size:15px;line-height:1.4;color:#4F5578}

#kickoff-step.go .klayer-far{animation:kscroll 24s linear infinite}
#kickoff-step.go .klayer-hills{animation:kscroll 12s linear infinite}
#kickoff-step.go .klayer-trees{animation:kscroll 3.2s linear infinite}
#kickoff-step.go .klayer-dash{animation:kscroll 1.6s linear infinite}
#kickoff-step.go .kdrive{animation:karrive 1.7s cubic-bezier(.2,.75,.25,1) forwards}
#kickoff-step.go .kbus{animation:kbump .36s ease-in-out infinite alternate}
#kickoff-step.go .kwheel{animation:kspin .5s linear infinite}
#kickoff-step.go .kmsg{animation:kpop .7s cubic-bezier(.3,1.4,.5,1) 2s both}

@keyframes kscroll{from{transform:translateX(0)}to{transform:translateX(-760px)}}
@keyframes karrive{from{transform:translateX(-380px)}to{transform:translateX(0)}}
@keyframes kbump{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
@keyframes kspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes kpop{

/* ---------- theme ---------- */
const themeBtn=document.getElementById('themeBtn');
themeBtn.addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  let next;
  if(cur==='dark')next='light'; else if(cur==='light')next='dark';
  else next=sysDark?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
});

  const input=document.getElementById('codeInput');
  const showCodeErr=()=>{
    let e=document.getElementById('codeErr');
    if(!e){ e=document.createElement('p'); e.id='codeErr'; e.setAttribute('role','alert');
      e.style.cssText='color:var(--bad);font-weight:600;font-size:.92rem;margin:10px 0 0';
      input.closest('.fld').insertAdjacentElement('afterend',e); }
    e.textContent='That codename isn’t recognised. Please check with your facilitator and try again.';
    input.setAttribute('aria-invalid','true'); input.focus(); input.select();
  };
  const go=()=>{
    const raw=input.value.trim();
    if(!raw)return;
    if(!resolveWorld(raw)){ showCodeErr(); return; }   // only alpha / bravo / charlie open a world
    panel.className='panel';panel.innerHTML='';
    fadeBlack(()=>{S.sceneIdx=0;renderScene();});
  };
  document.getElementById('beginBtn').addEventListener('click',go);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  input.addEventListener('input',()=>{const e=document.getElementById('codeErr'); if(e)e.remove(); input.removeAttribute('aria-invalid');});
  setTimeout(()=>input.focus(),300);
}
function resolveWorld(raw){
  const k=raw.toLowerCase().trim();
  // Only three valid codenames (any case). Nothing else opens a world.
  //   alpha   -> Women Empowerment (Hunarabad)
  //   bravo   -> Health (Basti Noor)
  //   charlie -> Digital Literacy (Banaras Town)
  const WID={alpha:'hunarabad', bravo:'bastinoor', charlie:'banarastown'};
  const TOWN={hunarabad:'Hunarabad', bastinoor:'Basti Noor', banarastown:'Banaras Town'};
  const wid=WID[k];
  if(!wid){ S.world=null; return false; }     // unknown codename: caller keeps the player on the start screen
  S.world=WORLDS[wid];
  S.groupName=TOWN[wid];                        // greet by the town (the codename->town map is never shown)
  return true;
}

/* ---------- STORY INTRO: 5 slides, word-by-word reveal ---------- */
/* slide text lives in WORLDS[world].scenes, art in STORY_ART[world]; the pace in WORLDS[world].story */
function stopStory(){ if(S._storyCleanup){ S._storyCleanup(); S._storyCleanup=null; } }
function renderScene(){ startStory(); }

function startStory(){
  stopStory();
  const w=S.world, SL=w.scenes, ART=STORY_ART[w.id]||[];
  const base=Math.max(40,Math.min(300,(w.story&&w.story.msPerWord)||110));
  const lastI=SL.length-1;
  meterBar.hidden=true;

  stage.innerHTML=`<div class="s-root" id="story"><div class="s-stage" id="sstage">
    <div class="s-artbox">
      ${SL.map((s,i)=>`<div class="s-scene" data-i="${i}">${ART[i]||''}</div>`).join('')}
      ${STORY_MOTES}<div class="s-shade"></div>
      <div class="s-bar">${SL.map(()=>'<div class="s-seg"></div>').join('')}</div>
    </div>
    <div class="s-dock" id="sdock">
      <div class="s-caption"><span class="s-sr" id="ssr" aria-live="polite"></span><span id="swords" aria-hidden="true"></span></div>
      <div id="scard"></div>
    </div>
    <div class="s-ctrl">
      <button class="s-btn s-btn-ghost" type="button" id="sback" hidden>Back</button>
      <button class="s-btn s-btn-main" type="button" id="snext">Skip</button>
    </div>
  </div></div>`;

  const root=document.getElementById('story'), st=document.getElementById('sstage');
  const scenes=[...st.querySelectorAll('.s-scene')], segs=[...st.querySelectorAll('.s-seg')];
  const dock=document.getElementById('sdock'), wordsEl=document.getElementById('swords');
  const sr=document.getElementById('ssr'), card=document.getElementById('scard');
  const back=document.getElementById('sback'), next=document.getElementById('snext');
  let idx=0, shown=0, timer=null, planning=false;

  const wordsOf=i=>SL[i].lines.join(' ').split(' ');
  const done=()=>shown>=wordsOf(idx).length;

  function paintControls(){
    back.hidden=(idx===0);
    next.hidden=(idx===lastI);
    next.textContent=done()?'Continue':'Skip';
    if(idx===lastI&&done()){
      if(!card.firstChild){
        card.innerHTML=`<div class="s-card"><p>${escapeHtml(SL[idx].taskCard||'')}</p>
          <button class="s-go" type="button" id="sgo">${escapeHtml(SL[idx].button||'Continue')}</button></div>`;
      }
    }else card.innerHTML='';
  }
  function paintSlide(){
    scenes.forEach((el,i)=>el.classList.toggle('s-on',i===idx));
    segs.forEach((el,i)=>el.classList.toggle('s-on',i<=idx));
    dock.classList.toggle('s-last',idx===lastI);
    // every word is laid out from the start, so nothing re-wraps while revealing
    wordsEl.innerHTML=wordsOf(idx).map((t,i)=>`<span class="s-w${i<shown?' s-on':''}">${escapeHtml(t)}</span>`).join('');
    sr.textContent=SL[idx].lines.join(' ');
    paintControls();
  }
  function reveal(){
    const ws=wordsOf(idx);
    if(shown>=ws.length)return;
    const el=wordsEl.children[shown]; if(el)el.classList.add('s-on');
    shown++;
    if(shown<ws.length){
      const lw=ws[shown-1]; let extra=0;
      if(/[.?!][’”]*$/.test(lw))extra=base*2.2;
      else if(/[,;:][’”]*$/.test(lw))extra=base;
      timer=setTimeout(reveal,base+extra);
    }else paintControls();
  }
  function go(to,instant){
    clearTimeout(timer);
    idx=to; shown=instant?wordsOf(to).length:0;
    paintSlide();
    if(!instant)timer=setTimeout(reveal,700); // let the crossfade finish first
  }
  function skipText(){
    clearTimeout(timer);
    shown=wordsOf(idx).length;
    [...wordsEl.children].forEach(el=>el.classList.add('s-on'));
    paintControls();
  }
  function press(){ if(!done())skipText(); else if(idx<lastI)go(idx+1,false); }
  function makePlan(){
    if(planning)return; planning=true;
    root.classList.add('s-dim');          // the scene blurs and dims, then Part A opens over it
    setTimeout(()=>startPlan(),650);
  }

  next.addEventListener('click',press);
  back.addEventListener('click',()=>{ if(idx>0)go(idx-1,true); });
  root.addEventListener('click',e=>{
    if(e.target.closest('#sgo')){ makePlan(); return; }
    if(e.target.closest('button,.s-card'))return;
    // tap anywhere else: first tap finishes the text, next tap moves on
    if(idx===lastI){ if(!done())skipText(); } else press();
  });

  function fit(){
    const r=root.getBoundingClientRect();
    const mob=r.width<=820||r.height>r.width*1.1;
    st.classList.toggle('mob',mob);
    st.style.transform=mob?'':'scale('+Math.min(r.width/1280,r.height/720)+')';
  }
  fit();
  const ro=(typeof ResizeObserver!=='undefined')?new ResizeObserver(fit):null;
  if(ro)ro.observe(root); else window.addEventListener('resize',fit);

  S._storyCleanup=()=>{ clearTimeout(timer); if(ro)ro.disconnect(); else window.removeEventListener('resize',fit); };
  requestAnimationFrame(()=>go(0,false)); // first slide fades in from black
}

/* ==================================================================
   PART A - THE PLAN
   ================================================================== */
let planStep=0;
function startPlan(){
  stopStory();
  // keep blurred gate behind
  stage.innerHTML=`<div class="scene active"><div class="bgwrap">${BG.gate()}</div>
    <div class="scrim on"></div></div>`;
  planStep=0;
  // Transport and Alumni Food start inside the bucket (CONFIG.defaultSelected)
  const a2=S.world.plan.a2, def=a2.defaultSelected;
  S.plan.bucketSel=def.slice();
  const bs={};a2.sacks.forEach(s=>bs[s.key]=def.includes(s.key)?s.cost:0);
  S.plan.budget=bs;
  S.plan.reserve=a2.total-a2.sacks.reduce((t,s)=>t+bs[s.key],0);
  renderPlan();
}
function planBarHtml(n,wide){return `<div class="pbar"${wide?' style="max-width:'+(wide===true?680:wide)+'px"':''}>${[0,1,2,3,4].map(i=>`<span class="pseg ${i<=n?'on':''}"></span>`).join('')}</div>`;}

function renderPlan(){
  if(S._bucketCleanup){S._bucketCleanup();S._bucketCleanup=null;}
  panel.className='panel active';
  const steps=[planA1,planA2,planA3,planA4,planA5];
  steps[planStep]();
}
function planShell(inner,opts){
  opts=opts||{};
  const w=opts.wide?' style="max-width:'+(opts.wide===true?680:opts.wide)+'px"':'';
  panel.innerHTML=`<div class="sheet">${planBarHtml(planStep,opts.wide)}
    <div class="box${opts.light?' bl':''}${opts.cls?' '+opts.cls:''}"${w}>${inner}</div></div>`;
  panel.scrollTop=0;
}

/* mounts the component into `root`; returns a destroy() function */
function mountBucket(root,CONFIG,initial){
  const CAP=CONFIG.capacity,K=76/56,items=CONFIG.items;
  const by=Object.fromEntries(items.map(i=>[i.id,i]));
  const slots=[[78,196],[120,200],[162,196],[57,150],[99,150],[141,150],[183,150],[78,106],[120,104],[162,106]];
  const state=initial.slice(),flying=new Set(),btns={},gs={};
  let busy=false,dlg=null,lastFocus=null,dead=false;
  const q=s=>root.querySelector(s);
  const st=q('#bstage'),bk=q('#bk'),inside=q('#binside'),pile=q('#bpile');
  const fmt=n=>'PKR '+n.toLocaleString('en-US');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const spent=()=>state.reduce((s,id)=>s+by[id].cost,0);
  const selection=()=>({selected:state.slice(),spent:spent(),left:CAP-spent()});
  const emit=name=>document.dispatchEvent(new CustomEvent(name,{detail:selection()}));

  items.forEach(it=>{
    const b=document.createElement('button');
    b.type='button';b.className='sack';
    b.style.left=it.x+'%';b.style.top=it.y+'%';
    b.setAttribute('aria-label',it.name+' sack. Tap to reveal');
    b.innerHTML='<span class="art" style="transform:rotate('+it.r+'deg)"><svg width="76" height="82" aria-hidden="true"><use href="#sk"/></svg></span>';
    b.addEventListener('click',()=>openCard(it));
    pile.appendChild(b);
    btns[it.id]=b;
  });

  function render(){
    items.forEach(it=>{
      const b=btns[it.id];
      b.classList.toggle('in',state.includes(it.id));
      b.classList.toggle('away',flying.has(it.id));
    });
    Object.keys(gs).forEach(id=>{if(!state.includes(id)){gs[id].remove();delete gs[id];}});
    state.forEach((id,i)=>{
      if(!gs[id]){
        const g=document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('class','bs');
        g.setAttribute('tabindex','0');
        g.setAttribute('role','button');
        g.setAttribute('aria-label',by[id].name+', in the bucket. Open details');
        g.style.transform='translate('+slots[i][0]+'px,'+slots[i][1]+'px)';
        g.style.transition='transform .35s cubic-bezier(.3,1.3,.5,1)';
        g.innerHTML='<use href="#sk" x="-23" y="-25" width="46" height="50"/>'
          +(by[id].tag?'<text x="0" y="10" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b1a05" stroke="#f3e2b4" stroke-width="2.2" paint-order="stroke" style="pointer-events:none">'+by[id].tag+'</text>':'');
        g.addEventListener('click',()=>openCard(by[id]));
        g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard(by[id]);}});
        inside.appendChild(g);
        gs[id]=g;
      }else{
        gs[id].style.transform='translate('+slots[i][0]+'px,'+slots[i][1]+'px)';
      }
    });
    const s=spent();
    q('#blf').textContent=fmt(CAP-s);
    q('#bbar').style.width=(s/CAP*100)+'%';
    q('#bft').innerHTML='In the bucket: <b style="font-weight:500;color:#b07a14">'+fmt(s)+'</b> · Left as reserve: <b style="font-weight:500;color:#1f7a52">'+fmt(CAP-s)+'</b>';
    emit('bucket:change');
  }

  function slotPt(i){
    const r=bk.getBoundingClientRect(),sc=r.width/240;
    return {x:r.left+slots[i][0]*sc,y:r.top+slots[i][1]*sc,sc:sc,rimY:r.top+68*sc};
  }
  function artPt(id){
    const r=btns[id].querySelector('.art').getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.top+r.height/2};
  }

  function fly(from,to,fs,ts,apexY,r0,r1){
    const sr=st.getBoundingClientRect();
    const el=document.createElement('div');
    el.className='clone';
    el.style.left=(from.x-sr.left-28)+'px';
    el.style.top=(from.y-sr.top-30)+'px';
    el.innerHTML='<svg width="56" height="60"><use href="#sk"/></svg>';
    st.appendChild(el);
    const dx=to.x-from.x,dy=to.y-from.y,ax=dx*.55,ay=apexY-from.y;
    const a=el.animate([
      {transform:'translate(0,0) scale('+fs+') rotate('+r0+'deg)'},
      {transform:'translate('+ax+'px,'+ay+'px) scale('+((fs+ts)/2+.12)+') rotate(-14deg)',offset:.5},
      {transform:'translate('+dx+'px,'+dy+'px) scale('+ts+') rotate('+r1+'deg)'}
    ],{duration:reduce?1:640,easing:'cubic-bezier(.45,.05,.4,1)',fill:'forwards'});
    return a.finished.then(()=>el.remove());
  }
  function bump(){
    if(reduce)return;
    bk.animate([{transform:'scale(1,1)'},{transform:'scale(1.035,.96)'},{transform:'scale(1,1)'}],{duration:280,easing:'ease-out'});
  }

  async function add(it){
    const from=artPt(it.id),t=slotPt(state.length);
    flying.add(it.id);render();
    await fly(from,t,K,46*t.sc/56,Math.min(t.rimY-60,from.y-30),it.r,0);
    if(dead)return;
    flying.delete(it.id);state.push(it.id);render();bump();
  }
  async function drop(it){
    const idx=state.indexOf(it.id),t=slotPt(idx),to=artPt(it.id);
    state.splice(idx,1);flying.add(it.id);render();
    await fly(t,to,46*t.sc/56,K,Math.min(t.rimY-60,to.y-30),0,it.r);
    if(dead)return;
    flying.delete(it.id);render();
  }

  function closeCard(){
    if(!dlg)return;
    dlg.remove();dlg=null;
    document.removeEventListener('keydown',onKey);
    if(!dead&&lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
  }
  function onKey(e){
    if(!dlg)return;
    if(e.key==='Escape'){closeCard();return;}
    if(e.key==='Tab'){
      const f=dlg.querySelectorAll('button');
      const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  }

  function openCard(it){
    if(busy)return;
    if(dlg)closeCard();
    lastFocus=document.activeElement;
    const inB=state.includes(it.id),left=CAP-spent(),fits=inB||it.cost<=left;
    const origin=inB?slotPt(state.indexOf(it.id)):artPt(it.id);
    const sc=document.createElement('div');
    sc.className='bscrim';
    sc.innerHTML='<div class="pop" role="dialog" aria-modal="true" aria-labelledby="bpt">'
      +'<svg width="60" height="64" viewBox="0 0 56 60" aria-hidden="true"><use href="#sk"/></svg>'
      +'<div class="pt" id="bpt">'+it.name+'</div>'
      +'<div class="pd">'+it.desc+'</div>'
      +'<div class="pp">'+fmt(it.cost)+'</div>'
      +'<div class="pw" id="bpw"></div>'
      +(it.fixed?'<div class="prow"><button type="button" class="pb pri" id="bgo">Got it</button></div></div>'
      :'<div class="prow"><button type="button" class="pb pri" id="bgo">'+(inB?'Take out':'Add to bucket')+'</button><button type="button" class="pb sec" id="bno">'+(inB?'Keep it':'Leave')+'</button></div></div>');
    pile.appendChild(sc);
    dlg=sc;
    const pop=sc.querySelector('.pop'),pw=sc.querySelector('#bpw');
    if(it.fixed){pw.textContent='Always in the bucket. The day can’t run without it.';}
    else if(inB){pw.textContent='It’s in the bucket now.';}
    else if(!fits){pw.textContent='Only '+fmt(left)+' left, so this won’t fit. Take something out first.';pw.style.color='#a32d2d';}
    else{pw.textContent=fmt(left)+' left in the bucket.';}
    if(!reduce){
      const pr=pop.getBoundingClientRect();
      pop.style.transformOrigin=(origin.x-pr.left)+'px '+(origin.y-pr.top)+'px';
      sc.animate([{opacity:0},{opacity:1}],{duration:200});
      pop.animate([{transform:'scale(.12)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:340,easing:'cubic-bezier(.2,1.15,.4,1)'});
    }
    sc.addEventListener('click',e=>{if(e.target===sc)closeCard();});
    const bno=sc.querySelector('#bno'); if(bno)bno.addEventListener('click',closeCard);
    sc.querySelector('#bgo').addEventListener('click',()=>{
      if(it.fixed){closeCard();return;}
      if(inB){closeCard();busy=true;drop(it).finally(()=>busy=false);return;}
      if(!fits){
        if(!reduce)pop.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:380});
        return;
      }
      closeCard();busy=true;add(it).finally(()=>busy=false);
    });
    document.addEventListener('keydown',onKey);
    sc.querySelector('#bgo').focus({preventScroll:true});
  }

  q('#bback').addEventListener('click',()=>emit('bucket:back'));
  q('#bnext').addEventListener('click',()=>{if(!busy)emit('bucket:next');});
  render();

  return function destroy(){
    dead=true;
    document.removeEventListener('keydown',onKey);
  };
}

function planA2(){
  const a2=S.world.plan.a2, total=a2.total;
  planShell(`
    <div class="eyebrow">Step 2: The money</div>
    <h2>One bucket, PKR ${total.toLocaleString()}</h2>
    <p class="lead">Choose what goes into the bucket. Each thing has a fixed price and goes in once. Transport and food for your team are already in the bucket. You can’t fit everything else, so decide what the day truly needs.</p>
    ${BUCKET_MARKUP}`,{wide:true,light:true});

  const CONFIG={capacity:total,defaultSelected:a2.defaultSelected,
    items:a2.sacks.map(s=>({id:s.key,name:s.label,desc:s.hint,cost:s.cost,x:s.x,y:s.y,r:s.r,fixed:!!s.fixed,tag:s.fixed?s.label:''}))};

  // keep the existing scoring inputs in sync: budget[key] = cost if in the bucket, reserve = left
  const persist=d=>{
    S.plan.bucketSel=d.selected.slice();
    a2.sacks.forEach(s=>{S.plan.budget[s.key]=d.selected.includes(s.key)?s.cost:0;});
    S.plan.reserve=d.left;
  };
  const onChange=e=>persist(e.detail);
  const onBack=e=>{persist(e.detail);planStep=0;renderPlan();};
  const onNext=e=>{persist(e.detail);planStep=2;renderPlan();};
  document.addEventListener('bucket:change',onChange);
  document.addEventListener('bucket:back',onBack);
  document.addEventListener('bucket:next',onNext);

  const destroy=mountBucket(panel.querySelector('#bucket-step'),CONFIG,S.plan.bucketSel||a2.defaultSelected);
  S._bucketCleanup=()=>{
    destroy();
    document.removeEventListener('bucket:change',onChange);
    document.removeEventListener('bucket:back',onBack);
    document.removeEventListener('bucket:next',onNext);
  };
}

    <span class="vwho">${v.name}</span>

  planShell(`<div id="vendor-step">
    <div class="vstep">Step 3, the quote</div>
    <h2 class="vtitle">${S.world.plan.a3.title||'Three vendors sent quotes'}</h2>
    <p class="vsub">${S.world.plan.a3.intro||'For printing the notebooks and materials. This is the quality your Notebooks sack pays for.'}</p>
    <p class="vhint">Tap a thought to pick your vendor.</p>
    <div class="vpicks vinit" id="vpicks">${vs.map(pickHtml).join('')}</div>
    <div class="vfoot">
      <span class="vstatus" id="vstatus" aria-live="polite"></span>
      <div class="vbtns"><button class="vbtn vback" type="button" id="b3">Back</button>
        <button class="vbtn vnext" type="button" id="n3" disabled>Next</button></div>
    </div>
  </div>`,{wide:760,light:true,cls:'bv'});

  const wrap=document.getElementById('vpicks'), next=document.getElementById('n3'), status=document.getElementById('vstatus');
  function paint(){
    const picked=S.plan.vendor;
    wrap.querySelectorAll('.vpick').forEach(b=>{
      const on=b.dataset.v===picked;
      b.classList.toggle('is-on',on);
      b.classList.toggle('is-dim',!!picked&&!on);
      b.setAttribute('aria-pressed',on?'true':'false');
    });
    const v=vs.find(x=>x.key===picked);
    status.textContent=v?`${v.name}${v.cost!=null?', PKR '+fmtP(v.cost):''} selected.`:'Pick a vendor to continue.';
    next.disabled=!v;
  }
  wrap.addEventListener('click',e=>{
    const b=e.target.closest('.vpick');if(!b)return;
    wrap.classList.remove('vinit'); // hop plays only on a real pick, not on re-entry
    S.plan.vendor=b.dataset.v;
    paint();
  });
  paint();
  document.getElementById('b3').addEventListener('click',()=>{planStep=1;renderPlan();});
  next.addEventListener('click',()=>{if(S.plan.vendor){planStep=3;renderPlan();}});
}

/* ==================================================================
   PART B - THE FIELD
   ================================================================== */
function startField(){
  // starting meters from the plan (per-world)
  const fsCfg=S.world.fieldStart;
  if(fsCfg){
    const m={};
    S.world.meters.forEach(mt=>{ m[mt.key]=(typeof fsCfg[mt.key]==='number')?fsCfg[mt.key]:50; });
    if(fsCfg.spendKey){ const total=S.world.plan.a2.total, reserve=S.plan.reserve||0, spent=total-reserve;
      m[fsCfg.spendKey]=clampM(m[fsCfg.spendKey]+Math.round((spent/total)*(fsCfg.spendBonus||0))); }
    if(fsCfg.reserveKey){ const total2=S.world.plan.a2.total, reserve2=S.plan.reserve||0;
      m[fsCfg.reserveKey]=clampM(Math.round((fsCfg.reserveBase||0)+(reserve2/total2)*(fsCfg.reserveScale||100))); }
    const vv=S.world.plan.a3.vendors.find(x=>x.key===S.plan.vendor);
    if(vv&&vv.startEff)for(const k in vv.startEff){ if(k in m)m[k]=clampM(m[k]+vv.startEff[k]); }
    S.meters=m;
  } else {
    const reserve=S.plan.reserve||0;
    let budget=(reserve/20000)*100;
    if(S.plan.vendor==='C')budget-=10;
    S.meters={budget:clampM(budget),trust:50,morale:50};
  }
  S.cardIdx=0;S.failedEarly=false;S.notes={};
  panel.className='panel';panel.innerHTML='';
  meterBar.hidden=true;              // meters are hidden through the field; they appear only at the debrief
  fadeBlack(()=>{renderCard();});
}

function renderMeters(instant){
  const ms=S.world.meters;
  meterBar.innerHTML=ms.map(m=>{
    const val=Math.round(S.meters[m.key]);
    return `<div class="meter"><div class="mh"><span>${m.label}</span><b id="mb_${m.key}">${val}</b></div>
      <div class="track"><div class="fill" id="mf_${m.key}" style="width:${val}%;background:${meterColor(val)}"></div></div></div>`;
  }).join('');
}
function meterColor(v){if(v>=60)return 'var(--good)';if(v>=30)return 'var(--warn)';return 'var(--bad)';}
function animateMeters(){
  S.world.meters.forEach(m=>{
    const val=Math.round(S.meters[m.key]);
    const f=document.getElementById('mf_'+m.key),b=document.getElementById('mb_'+m.key);
    if(f){f.style.width=val+'%';f.style.background=meterColor(val);}
    if(b){// count up/down
      const from=+b.textContent;const steps=14;let i=0;
      const t=setInterval(()=>{i++;b.textContent=Math.round(from+(val-from)*(i/steps));
        if(i>=steps){b.textContent=val;clearInterval(t);}},26);}
  });
}

/* ---- field "mini chapter": vignette + two beats + slide-up question (keeps the text box) ---- */
function renderBeatCard(card){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const vig=VIGNETTE[card.vignette]||'';
  stage.innerHTML=`<div class="scene active" style="background:radial-gradient(130% 100% at 50% 0,color-mix(in srgb,var(--gold) 10%,var(--paper)),var(--paper))"></div>`;
  panel.className='panel active';
  let beat=0; // 0 = beat1, 1 = beat2, 2 = question + text box
  function draw(){
    if(beat<2){
      panel.innerHTML=`<div class="sheet"><div class="ocard" id="oc">
        <div class="vig">${vig}</div>
        <div class="tag">${card.tag}</div>
        <p class="narr">${beat===0?card.beat1:card.beat2}</p>
        <button class="btn big" id="bnx" style="width:100%">Next</button>
      </div></div>`;
      const oc=document.getElementById('oc');
      if(reduce)oc.classList.add('in'); else requestAnimationFrame(()=>oc.classList.add('in'));
      document.getElementById('bnx').addEventListener('click',next);
    }else{
      panel.innerHTML=`<div class="sheet"><div class="ocard in" id="oc">
        <div class="vig sm">${vig}</div>
        <h2>${card.title}</h2>
        <div class="fup" id="fup">
          <p class="qn">${card.question}</p>
          <label class="fnote" for="fnote">Write it in your own words.
            <textarea id="fnote" rows="4" placeholder="Type your answer here…"></textarea></label>
          <button class="btn big" id="fsend" style="width:100%" disabled>Continue</button>
        </div>
      </div></div>`;
      const fup=document.getElementById('fup');
      if(reduce)fup.classList.add('up'); else requestAnimationFrame(()=>fup.classList.add('up'));
      const fn=document.getElementById('fnote'),fs=document.getElementById('fsend');
      fn.addEventListener('input',()=>{fs.disabled=!fn.value.trim();});
      fs.addEventListener('click',()=>{if(!fs.disabled){panel.onclick=null;chooseCard();}});
    }
    panel.scrollTop=0;
  }
  function next(){ if(beat<2){beat++;draw();} }
  // tap anywhere on the card (not a button or the text box) advances the beats
  panel.onclick=e=>{ if(e.target.closest('button,textarea,input,.fup'))return; if(beat<2)next(); };
  draw();
}

/* split a beat into two narration lines: everything but the final sentence, then the final sentence */
function cinLines(text){
  const parts=String(text||'').split(/(?<=[.?!])\s+/).filter(Boolean);
  if(parts.length<=1)return [String(text||''),''];
  return [parts.slice(0,-1).join(' '), parts[parts.length-1]];
}

function renderPunctureCard(card){
  panel.onclick=null;
  stage.innerHTML=`<div class="scene active" style="background:radial-gradient(130% 100% at 50% 0,color-mix(in srgb,var(--gold) 10%,var(--paper)),var(--paper))"></div>`;
  panel.className='panel active';

  const ARROW=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
  const REPLAY=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>`;
  const SCENES=[
    { art:CIN_ART.drive, lines:cinLines(card.beat1), delays:['.2s','1.1s'], cta:'Continue', run:false },
    { art:CIN_ART.flat,  lines:cinLines(card.beat2), delays:['1.3s','2.1s'], cta:'Continue', run:true }
  ];
  let idx=0;

  function scene(){
    const s=SCENES[idx];
    const segs=Array.from({length:CIN_TOTAL_SCENES},(_,i)=>`<span class="${i<=idx?'on':''}"></span>`).join('');
    const narr=s.lines.filter(Boolean).map(l=>`<span>${l}</span>`).join('');
    panel.innerHTML=`<div class="sheet"><div class="ocard cin in" id="oc">
      <div class="cin-scene${s.run?' cin-run':''}" id="cinScene">${s.art}</div>
      <div class="cin-meta">
        <span class="tag">${card.tag}</span>
        <div class="cin-progress" role="img" aria-label="Scene ${idx+1} of ${CIN_TOTAL_SCENES}">${segs}</div>
      </div>
      <p class="cin-narr play" id="cinNarr" aria-live="polite" style="--d1:${s.delays[0]};--d2:${s.delays[1]}">${narr}</p>
      <button class="btn big cin-cta" id="cinCta" style="width:100%">${s.cta}${ARROW}</button>
    </div></div>`;
    panel.scrollTop=0;
    document.getElementById('cinCta').addEventListener('click',()=>{
      if(idx<SCENES.length-1){idx++;scene();} else question();
    });
  }

  function question(){
    const vig=VIGNETTE[card.vignette]||'';
    panel.innerHTML=`<div class="sheet"><div class="ocard in" id="oc">
      <div class="vig sm">${vig}</div>
      <h2>${card.title}</h2>
      <div class="fup" id="fup">
        <p class="qn">${card.question}</p>
        <label class="fnote" for="fnote">Write it in your own words.
          <textarea id="fnote" rows="4" placeholder="Type your answer here…"></textarea></label>
        <button class="btn big" id="fsend" style="width:100%" disabled>Continue</button>
      </div>
    </div></div>`;
    panel.scrollTop=0;
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fup=document.getElementById('fup');
    if(reduce)fup.classList.add('up'); else requestAnimationFrame(()=>fup.classList.add('up'));
    const fn=document.getElementById('fnote'),fs=document.getElementById('fsend');
    fn.addEventListener('input',()=>{fs.disabled=!fn.value.trim();});
    fs.addEventListener('click',()=>{if(!fs.disabled)chooseCard();});
  }

  scene();
}

function renderLanguageCard(card){
  panel.onclick=null;
  clearQgTimers();
  stage.innerHTML=`<div class="scene active" style="background:radial-gradient(130% 100% at 50% 0,color-mix(in srgb,var(--gold) 10%,var(--paper)),var(--paper))"></div>`;
  panel.className='panel active';
  const label=card.fieldLabel||card.tag, beat=card.beatName||'The session';
  const SCREENS=[
    {art:LW_ART.session, lines:card.narr1, cta:'Next'},
    {art:LW_ART.wall,    lines:card.narr2, cta:'Next'},
    {art:LW_ART.stuck,   decision:true,    cta:'Continue'}
  ];
  const MIN=12;
  let idx=0;
  function draw(){
    const s=SCREENS[idx];
    const meta=`<div class="lw-meta"><span class="lw-label">${label}</span><span class="lw-beat">${beat}</span></div>`;
    const scene=`<div class="lw-scene${s.decision?' lw-compact lw-static':''}">${s.art()}</div>`;
    const body=s.decision
      ?`${scene}${meta}
        <h2 class="lw-title">${card.title}</h2>
        <p class="lw-question">${card.question}</p>
        <label class="lw-flabel" for="fnote">Write it in your own words.</label>
        <textarea class="lw-answer" id="fnote" rows="4" placeholder="${card.placeholder||'Type your answer here…'}"></textarea>`
      :`${scene}${meta}
        <p class="lw-narr" aria-live="polite">${s.lines.map(l=>`<span>${l}</span>`).join('')}</p>`;
    panel.innerHTML=`<div class="sheet"><div class="ocard lw in" id="oc">${body}
      <button class="lw-cta" id="lwCta" type="button"${s.decision?' aria-disabled="true"':''}>${s.cta}${QG_ARROW}</button></div></div>`;
    panel.scrollTop=0;
    const oc=document.getElementById('oc'),cta=document.getElementById('lwCta');
    void oc.offsetWidth;            // reflow so every screen restarts its animation from the top
    oc.classList.add('lw-run');
    if(s.decision){
      const fn=document.getElementById('fnote');
      fn.addEventListener('input',()=>{cta.setAttribute('aria-disabled',fn.value.trim().length>=MIN?'false':'true');});
    }else cta.focus({preventScroll:true});
    cta.addEventListener('click',()=>{
      if(cta.getAttribute('aria-disabled')==='true')return;
      if(idx<SCREENS.length-1){idx++;draw();}else chooseCard();
    });
  }
  draw();
}

.sc-art{border:1px solid #D9C99A;border-radius:18px;overflow:hidden;line-height:0;margin-bottom:6px}
.sc-art svg{width:100%;height:auto;display:block}

@keyframes scHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scBob{from{transform:translateY(0)}to{transform:translateY(-5px)}}

function renderSceneCard(card){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sc=card.scene, screens=sc.screens;
  const sceneOf=sd=>sd.scene||sc.art;
  const names=[...new Set(screens.map(sceneOf))];       // every scene this card uses, in order of first use
  stage.innerHTML=`<div class="scene active" style="background:radial-gradient(130% 100% at 50% 0,color-mix(in srgb,var(--gold) 10%,var(--paper)),var(--paper))"></div>`;
  panel.className='panel active';
  let i=0;
  const arts=()=>names.map(n=>`<div class="sc-art" data-scene="${n}"${n===names[0]?'':' hidden'}>${SC_ART[n]()}</div>`).join('');
  panel.innerHTML=`<div class="sheet"><div class="ocard" id="oc">
    ${arts()}
    <div class="tag">${sc.label||card.tag}</div>
    <p class="narr sc-txt" id="scTxt" aria-live="polite"></p>
    <button class="btn big" id="scNx" style="width:100%" type="button">Next</button>
    <button class="btn big" id="scGo" style="width:100%" type="button" hidden>Continue</button>
    <div class="sc-dots" role="img" aria-label="Screen 1 of ${screens.length}" id="scDots">${screens.map((_,k)=>`<span class="sc-dot${k?'':' on'}"></span>`).join('')}</div>
  </div></div>`;
  const oc=document.getElementById('oc'),txt=document.getElementById('scTxt'),dots=document.getElementById('scDots'),
        nx=document.getElementById('scNx'),go=document.getElementById('scGo');
  if(reduce)oc.classList.add('in'); else requestAnimationFrame(()=>oc.classList.add('in'));
  function show(n){
    const sd=screens[n], last=n===screens.length-1;
    oc.querySelectorAll('.sc-art').forEach(w=>{w.hidden=w.dataset.scene!==sceneOf(sd);});
    oc.querySelector(`.sc-art[data-scene="${sceneOf(sd)}"] svg`).setAttribute('data-state',sd.state);
    txt.style.opacity=0;
    const apply=()=>{
      txt.textContent=sd.text; txt.style.opacity=1;
      nx.hidden=last;            // no Replay: the last screen shows only Continue
      go.hidden=!last;
      [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===n));
      dots.setAttribute('aria-label','Screen '+(n+1)+' of '+screens.length);
    };
    if(n===0&&i===0&&!txt.textContent||reduce)apply(); else setTimeout(apply,200);
  }
  function next(){
    if(i<screens.length-1){i++;show(i);}               // advance only; no loop-back (Replay removed)
  }
  function drawQuestion(){
    const sd=screens[screens.length-1];
    panel.innerHTML=`<div class="sheet"><div class="ocard in" id="oc">
      <div class="vig sm"><div class="sc-art">${SC_ART[sceneOf(sd)]()}</div></div>
      <h2>${card.title}</h2>
      <div class="fup" id="fup">
        <p class="qn">${card.question}</p>
        <label class="fnote" for="fnote">Write it in your own words.
          <textarea id="fnote" rows="4" placeholder="Type your answer here…"></textarea></label>
        <button class="btn big" id="fsend" style="width:100%" disabled>Continue</button>
      </div>
    </div></div>`;
    panel.querySelector('svg').setAttribute('data-state',sd.state);
    const fup=document.getElementById('fup');
    if(reduce)fup.classList.add('up'); else requestAnimationFrame(()=>fup.classList.add('up'));
    const fn=document.getElementById('fnote'),fs=document.getElementById('fsend');
    fn.addEventListener('input',()=>{fs.disabled=!fn.value.trim();});
    fs.addEventListener('click',()=>{if(!fs.disabled){panel.onclick=null;chooseCard();}});
    panel.scrollTop=0;
  }
  nx.addEventListener('click',next);
  go.addEventListener('click',()=>{panel.onclick=null;drawQuestion();});
  // tap anywhere advances, except on the last screen (there only Continue shows)
  panel.onclick=e=>{ if(e.target.closest('button,textarea,input'))return; if(i<screens.length-1)next(); };
  show(0);
}

/* ---- the "document" card: evening -> the gap -> the decision ---- */
function renderDocumentCard(card){
  panel.onclick=null;
  clearQgTimers();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const label=card.fieldLabel||card.tag, beat=card.beatName||'';
  stage.innerHTML=`<div class="scene active" style="background:radial-gradient(130% 100% at 50% 0,color-mix(in srgb,var(--gold) 10%,var(--paper)),var(--paper))"></div>`;
  panel.className='panel active';
  const meta=`<div class="qg-meta"><span class="tag">${label}</span><span class="qg-beat">${beat}</span></div>`;

  // build fresh DOM, then add qg-run after a reflow so the sequence restarts from the top every time
  function arm(){
    const oc=document.getElementById('oc');
    if(reduce){oc.classList.add('in','qg-run');return;}
    requestAnimationFrame(()=>{oc.classList.add('in'); void oc.offsetWidth; oc.classList.add('qg-run');});
  }

  function drawEvening(){
    clearQgTimers();
    panel.innerHTML=`<div class="sheet"><div class="ocard qg" id="oc">
      <div class="qg-scene">${QG_ART.evening()}</div>
      ${meta}
      <p class="qg-narr" aria-live="polite"><span>${card.evening}</span></p>
      <button class="btn big qg-cta" id="qgCta" style="width:100%">Pack up${QG_ARROW}</button>
    </div></div>`;
    panel.scrollTop=0; arm();
    document.getElementById('qgCta').addEventListener('click',drawGap);
  }
  function drawGap(){
    clearQgTimers();
    panel.innerHTML=`<div class="sheet"><div class="ocard qg" id="oc">
      <div class="qg-scene">${QG_ART.gapFull()}</div>
      ${meta}
      <p class="qg-narr" aria-live="polite"><span>${card.gap1}</span><span>${card.gap2}</span></p>
      <button class="btn big qg-cta" id="qgCta" style="width:100%">Think it through${QG_ARROW}</button>
    </div></div>`;
    panel.scrollTop=0; arm();
    showFieldMeters();
    document.getElementById('qgCta').addEventListener('click',drawDecision);
  }
  function drawDecision(){
    clearQgTimers();
    panel.innerHTML=`<div class="sheet"><div class="ocard qg in qg-run" id="oc">
      <div class="qg-scene cmp">${QG_ART.gapCompact()}</div>
      ${meta}
      <h2 style="font-family:'Fraunces',serif;font-weight:500">${card.title}</h2>
      <div class="fup" id="fup">
        <p class="qn" style="font-weight:400">${card.question}</p>
        <label class="fnote" for="fnote">Write it in your own words.</label>
        <textarea class="qg-answer" id="fnote" rows="4" placeholder="${card.placeholder||'Type your answer here…'}"></textarea>
        <div class="qg-hint"><span id="qgHint">A sentence or two is enough.</span><span class="qg-count" id="qgCount">0 / ${QG_MAX}</span></div>
        <button class="btn big qg-continue" id="fsend" style="width:100%" disabled>Continue</button>
      </div>
    </div></div>`;
    panel.scrollTop=0;
    const fup=document.getElementById('fup');
    if(reduce)fup.classList.add('up'); else requestAnimationFrame(()=>fup.classList.add('up'));
    const fn=document.getElementById('fnote'),fs=document.getElementById('fsend'),
      hint=document.getElementById('qgHint'),count=document.getElementById('qgCount');
    fn.addEventListener('input',()=>{
      if(fn.value.length>QG_MAX)fn.value=fn.value.slice(0,QG_MAX);
      count.textContent=fn.value.length+' / '+QG_MAX;
      const ok=fn.value.trim().length>=QG_MIN;
      fs.disabled=!ok;
      hint.textContent=ok?'Good. Continue when you are ready.':'A sentence or two is enough.';
    });
    fs.addEventListener('click',()=>{if(!fs.disabled)chooseCard();});
  }
  drawEvening();
}

/* ---- the language-wall Outcome, revealed after the answer (scoped) ---- */
function renderFieldOutcome(card){
  panel.onclick=null;
  clearQgTimers();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const oc_cfg=card.outcome||{};
  const {eff,text}=resolveField(card);           // the resolve branch that matches this team's plan
  const win=planRole('liaison');                  // the celebratory beats play only when the barrier is bridged
  const label=oc_cfg.fieldLabel||card.tag, beat=oc_cfg.beat||'Outcome', title=oc_cfg.title||card.title;
  stage.innerHTML=`<div class="scene active" style="background:radial-gradient(130% 100% at 50% 0,color-mix(in srgb,var(--gold) 10%,var(--paper)),var(--paper))"></div>`;
  panel.className='panel active';
  panel.innerHTML=`<div class="sheet"><div class="ocard qg${win?' qg-win':''}" id="oc">
    <div class="qg-scene">${QG_ART.wall()}</div>
    <div class="qg-meta"><span class="tag">${label}</span><span class="qg-beat">${beat}</span></div>
    <h2 style="font-family:'Fraunces',serif;font-weight:500">${title}</h2>
    <p class="narr">${text||'The moment passes, and the day moves on.'}</p>
    <button class="btn big qg-cta" id="qgCta" style="width:100%">Continue${QG_ARROW}</button>
  </div></div>`;
  panel.scrollTop=0;
  const oc=document.getElementById('oc');
  if(reduce){oc.classList.add('in','qg-run');} else requestAnimationFrame(()=>{oc.classList.add('in'); void oc.offsetWidth; oc.classList.add('qg-run');});
  showFieldMeters();
  document.getElementById('qgCta').addEventListener('click',()=>{clearQgTimers();nextCard();});
}

function renderCard(){
  const card=S.world.cards[S.cardIdx];
  if(card.cinematic){renderPunctureCard(card);return;}
  if(card.screens==='document'){renderDocumentCard(card);return;}
  if(card.scene){renderSceneCard(card);return;}
  if(card.screens==='language'){renderLanguageCard(card);return;}
  if(card.beats){renderBeatCard(card);return;}
  panel.onclick=null;
  // compute pre-effects (shown before choices)
  let preHtml='',preBecause=[],preEff={};
  const addEff=e=>{for(const k in e)preEff[k]=(preEff[k]||0)+e[k];};
  if(!card.resolve){
    if(card.preIf && S.plan.vendor===card.preIf.vendor){
      addEff(card.preIf.eff);preBecause.push(card.preIf.because);
      preHtml+=`<div class="pre">${card.preIf.add}</div>`;
    }
    // forgotten essentials hit the card they are tied to
    const miss=S.world.plan.a2.missing||{};
    for(const k in miss){
      const m=miss[k];
      if(m.card===card.key && !(S.plan.budget[k]>0)){
        addEff(m.eff);preBecause.push(m.because);
      }
    }
  }
  const bgHtml=BG[card.bg]?BG[card.bg]():'';
  stage.innerHTML=`<div class="scene active"><div class="bgwrap">${bgHtml}</div><div class="scrim on"></div></div>`;
  panel.className='panel active';
  panel.innerHTML=`<div class="sheet"><div class="ocard" id="oc">
    <div class="tag">${card.tag}</div>
    <h2>${card.title}</h2>
    <p class="narr">${card.story}</p>
    ${preHtml}
    <label class="fnote" for="fnote">What would you do here? Write it in your own words.
      <textarea id="fnote" rows="5" placeholder="Type your answer here…"></textarea></label>
    <button class="btn big" id="fsend" style="width:100%" disabled>Continue</button>
  </div></div>`;
  panel.scrollTop=0;
  requestAnimationFrame(()=>document.getElementById('oc').classList.add('in'));
  // apply pre-effects to meters now (so bar reflects them before choice)
  if(Object.keys(preEff).length){applyEff(preEff);animateMetersSoon();}
  // store pre-because notes to merge into consequence note
  S._preBecause=preBecause;
  const fn=document.getElementById('fnote'),fs=document.getElementById('fsend');
  fn.addEventListener('input',()=>{fs.disabled=!fn.value.trim();});
  fs.addEventListener('click',()=>{if(!fs.disabled)chooseCard();});
}
function animateMetersSoon(){setTimeout(animateMeters,250);}

function applyEff(eff){
  return; // meters removed: outcomes no longer change any score
  if(!eff)return;
  for(const k in eff){if(k in S.meters)S.meters[k]=clampM(S.meters[k]+eff[k]);}
}
function applyTraits(tr){if(!tr)return;for(const k in tr)S.traitPts[k]=(S.traitPts[k]||0)+tr[k];}

/* ---- declarative plan->field resolver (worlds with card.resolve) ---- */
function planHas(k){return !!(S.plan.budget&&S.plan.budget[k]>0);}
function planRole(k){return !!(S.plan.roles&&S.plan.roles[k]&&String(S.plan.roles[k]).length);}
function vendorFlag(){const v=S.world.plan.a3.vendors.find(x=>x.key===S.plan.vendor);return v&&v.flag;}
function testCond(c){
  if(c==='always')return true;
  const i=c.indexOf(':'),t=c.slice(0,i),k=c.slice(i+1);
  if(t==='have')return planHas(k);
  if(t==='miss')return !planHas(k);
  if(t==='role')return planRole(k);
  if(t==='norole')return !planRole(k);
  if(t==='vendor')return vendorFlag()===k;
  return false;
}
function condPass(w){return Array.isArray(w)?w.every(testCond):testCond(w);}
function resolveField(card){
  const eff={},lines=[];
  card.resolve.forEach(r=>{ if(condPass(r.when)){ for(const k in (r.eff||{}))eff[k]=(eff[k]||0)+r.eff[k]; if(r.say)lines.push(r.say); } });
  return {eff,text:lines.join(' ')};
}
function chooseCard(){
  // Record what the team wrote (shown back in the debrief) and move straight on.
  // No solution/consequence is shown after they write, and the field does not move the meters.
  const fn=document.getElementById('fnote');
  if(fn&&fn.value.trim()){S.notes=S.notes||{};S.notes[S.cardIdx]=fn.value.trim();}
  const card=S.world.cards[S.cardIdx];
  if(card&&card.outcome){renderFieldOutcome(card);return;} // scoped: only the Hunarabad language card reveals an outcome
  nextCard();
}

function renderConsequence(card,becauses,bodyHtml){
  // show consequence card
  const becHtml=becauses.length?`<div class="becnote">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--plum)" stroke-width="2.2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span><b>Because of your plan:</b> ${becauses.join(' ')}</span></div>`:'';
  const oc=document.getElementById('oc');
  oc.classList.remove('in');
  setTimeout(()=>{
    oc.innerHTML=`<div class="tag">${card.tag}</div>
      <h2>${card.title}</h2>
      <p class="conseq">${bodyHtml||'Your answer is noted. Here is how your plan shaped the moment.'}</p>
      ${becHtml}
      <button class="btn big" id="cont" style="width:100%">Continue</button>`;
    oc.classList.add('in');
    animateMeters();
    checkFail();
    document.getElementById('cont').addEventListener('click',nextCard);
  },260);
}
function checkFail(){
  S.failedEarly=false;
}
function nextCard(){
  if(S.failedEarly){goDebrief();return;}
  S.cardIdx++;
  if(S.cardIdx>=S.world.cards.length){goDebrief();return;}
  const oc=document.getElementById('oc');oc.classList.remove('in');
  setTimeout(renderCard,350);
}

/* ==================================================================
   DEBRIEF
   ================================================================== */
function goDebrief(){
  meterBar.hidden=true;
  // no meters, so no score-based verdict: the debrief is a reflective one
  const outcome='partial', od=S.world.debrief.partial;

  const outColor=outcome==='succeeded'?'var(--jade-deep)':outcome==='partial'?'var(--gold-deep)':'var(--bad)';
  const outLabel=od.label||(outcome==='succeeded'?'Succeeded':outcome==='partial'?'Partial':'Did not land');

  // trait bars (normalize to 0..100 for display from raw points)
  const traitRows=S.world.traits.map(t=>{
    const raw=S.traitPts[t.key]||0;
    const pct=Math.max(4,Math.min(100,50+raw*11)); // center 50, each point ~11%
    return `<div class="tb"><div class="top"><b>${t.label}</b><span class="n">${raw>0?'+':''}${raw}</span></div>
      <div class="trk"><div class="fl" data-w="${pct}" style="width:0%"></div></div></div>`;
  }).join('');

  // what the team actually packed into the bucket (their A2 choices), read back for reflection
  const fmtPkr=n=>'PKR '+Number(n||0).toLocaleString();
  const chosen=S.world.plan.a2.sacks.filter(s=>S.plan.budget[s.key]>0);
  const total=S.world.plan.a2.total, reserve=S.plan.reserve||0, spent=total-reserve;
  const chosenHtml=chosen.length
    ?`<div class="q">What you packed into the bucket</div>
       <div>${chosen.map(s=>`${s.label} (${fmtPkr(S.plan.budget[s.key])})`).join(', ')}.</div>
       <div class="muted" style="margin-top:4px">Spent ${fmtPkr(spent)} of ${fmtPkr(total)}, leaving ${fmtPkr(reserve)} in reserve.</div>`
    :`<div class="q">What you packed into the bucket</div><div>Nothing was added to the bucket: the whole ${fmtPkr(total)} was left unspent.</div>`;

  const essentials=S.world.plan.a2.sacks.filter(s=>s.essential);
  const forgot=essentials.filter(s=>!(S.plan.budget[s.key]>0)).map(s=>s.label);
  const forgotHtml=forgot.length
    ?`<div class="q">Left out of the bucket</div><div>${forgot.join(', ')}: the essentials the day could not run without.</div>`
    :`<div class="q">Essentials</div><div>${essentials.map(s=>s.label).join(' and ')} were both covered.</div>`;
  const notesHtml=S.world.cards.map((c,i)=>(S.notes&&S.notes[i])
    ?`<div class="q">${c.title}</div><div>${escapeHtml(S.notes[i])}</div>`:'').join('');
  const planback=`<div class="planback">${chosenHtml}
    ${forgotHtml}
    <div class="q">The core problem, in your words</div>
    <div>${S.plan.a1.p?escapeHtml(S.plan.a1.p):'<span class="muted">-</span>'}</div>
    <div class="q">What you set out to do</div>
    <div>${S.plan.a1.d?escapeHtml(S.plan.a1.d):'<span class="muted">-</span>'}</div>
  </div>`;

  stage.innerHTML=`<div class="scene active"><div class="bgwrap">${(BG[S.world.arriveBg]||BG.arrive)()}</div><div class="scrim on"></div></div>`;
  panel.className='panel active';
  panel.innerHTML=`<div class="sheet">
    <div class="box verdict">
      <div class="eyebrow">The debrief</div>
      <div class="big" style="color:${outColor}">${outLabel}</div>
      <h2 style="margin:.3em 0 0">${od.title}</h2>
      <p class="sub">${od.body}</p>
    </div>
    <div class="box">
      <div class="eyebrow">Back to your plan</div>
      <p class="lead" style="margin:6px 0 14px">Read this aloud together. Did the field change your answer?</p>
      ${planback}
    </div>
    ${notesHtml?`<div class="box">
      <div class="eyebrow">What you wrote in the field</div>
      <div class="planback" style="margin-top:12px">${notesHtml}</div>
    </div>`:''}
    <button class="btn big ghost" id="again">Play again</button>
  </div>`;
  panel.scrollTop=0;
  requestAnimationFrame(()=>{setTimeout(()=>{
    panel.querySelectorAll('.tb .fl').forEach(el=>{el.style.width=el.dataset.w+'%';});
  },200);});
  document.getElementById('again').addEventListener('click',()=>{
    S.plan={a1:{p:"",d:""},budget:{},vendor:null,roles:{}};
    S.meters={budget:50,trust:50,morale:50};
    S.traitPts={adaptability:0,resourcefulness:0,stakeholder:0,composure:0,integrity:0};
    S.cardIdx=0;S.sceneIdx=0;S.failedEarly=false;S.notes={};
    fadeBlack(showCodename);
  });
}

/* ---------- util ---------- */
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function logoMark(){return `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 20 L4 6 Q12 2 20 6 L20 13 Q12 9 4 13 Z" fill="var(--gold)"/>
  <line x1="4" y1="6" x2="4" y2="22" stroke="var(--plum)" stroke-width="2.2" stroke-linecap="round"/></svg>`;}

/* ---------- cloud + rain keyframe injection ---------- */
const kf=document.createElement('style');
kf.textContent=`
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(440px)}}
@keyframes drift2{from{transform:translateX(440px)}to{transform:translateX(-60px)}}
@keyframes ride{from{transform:translateX(-40px)}to{transform:translateX(440px)}}
@keyframes rainfall{from{transform:translateY(-30px)}to{transform:translateY(60px)}}
.cloud{animation:drift 34s linear infinite}
.cloud2{animation:drift2 46s linear infinite}
.cycle{animation:ride 14s linear infinite}
.rainG{animation:rainfall .7s linear infinite}
@media (prefers-reduced-motion:reduce){.cloud,.cloud2,.cycle,.rainG{animation:none}}
`;
document.head.appendChild(kf);

/* ---------- boot ---------- */
showCodename();
</script>
